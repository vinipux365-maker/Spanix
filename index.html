/* ---------- FX: конфетти, искры, взрывы ---------- */
const FX = (() => {
  const cv = document.createElement('canvas'); cv.id = 'fx'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); let W = 0, H = 0; const P = []; let shake = 0;
  const size = () => { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener('resize', size);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLS = ['#ffd84a', '#ff5fa2', '#8b7cff', '#2fe08f', '#3aa8ff', '#ff8a3a', '#ffffff'];
  const add = p => { if (!reduce && P.length < 700) P.push(p); };
  function confetti(x, y, n = 90, pw = 1) { for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.15, v = (5 + Math.random() * 9) * pw; add({ k: 'c', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .3, dr: .985, life: 90 + Math.random() * 70, t: 0, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(COLS) }); } }
  function rain(n = 120) { for (let i = 0; i < n; i++) add({ k: 'c', x: Math.random() * W, y: -10 - Math.random() * H * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, g: .04, dr: .995, life: 230, t: 0, w: 6 + Math.random() * 5, h: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, c: pick(COLS) }); }
  function sparks(x, y, c = '#ffd84a', n = 26, sp = 5) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * sp; add({ k: 's', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .07, dr: .94, life: 30 + Math.random() * 25, t: 0, r: 1.5 + Math.random() * 2.5, c }); } }
  function boom(x, y) {
    sparks(x, y, '#ffb21f', 44, 9); sparks(x, y, '#ff4d1a', 30, 6); sparks(x, y, '#fff3b0', 16, 4);
    for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, v = .5 + Math.random() * 2; add({ k: 'm', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .4, g: -.01, dr: .97, life: 60 + Math.random() * 30, t: 0, r: 8 + Math.random() * 10 }); }
    add({ k: 'r', x, y, life: 26, t: 0 }); add({ k: 'f', x, y, life: 10, t: 0 }); shake = 14;
  }
  function text(x, y, s2, c = '#3ee07f') { add({ k: 't', x, y, vx: 0, vy: -1.3, g: 0, dr: .985, life: 70, t: 0, s: s2, c }); }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.t++; if (p.t > p.life) { P.splice(i, 1); continue; } const k = 1 - p.t / p.life;
      if (p.k === 'r') { ctx.beginPath(); ctx.arc(p.x, p.y, 10 + p.t * 5, 0, Math.PI * 2); ctx.strokeStyle = '#ffcf4a'; ctx.globalAlpha = k; ctx.lineWidth = 5 * k + 1; ctx.stroke(); ctx.globalAlpha = 1; continue; }
      if (p.k === 'f') { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 90); g.addColorStop(0, `rgba(255,240,180,${k})`); g.addColorStop(1, 'rgba(255,120,30,0)'); ctx.fillStyle = g; ctx.fillRect(p.x - 90, p.y - 90, 180, 180); continue; }
      p.vx *= p.dr; p.vy = p.vy * p.dr + p.g; p.x += p.vx; p.y += p.vy;
      if (p.k === 'c') { p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.t * .15 + p.rot))); ctx.restore(); }
      else if (p.k === 's') { ctx.globalAlpha = k; ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + .3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
      else if (p.k === 'm') { ctx.fillStyle = `rgba(80,76,90,${k * .4})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.7 - k * .7), 0, Math.PI * 2); ctx.fill(); }
      else if (p.k === 't') { ctx.globalAlpha = Math.min(1, k * 2.2); ctx.font = '900 24px Onest, -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(p.s, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y); ctx.globalAlpha = 1; }
    }
    const app = document.getElementById('app');
    if (shake > .4) { app.style.transform = `translate(${(Math.random() - .5) * shake}px,${(Math.random() - .5) * shake}px)`; shake *= .86; if (shake <= .4) app.style.transform = ''; }
  }
  const at = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  return { confetti, rain, sparks, boom, text, frame, at, get busy() { return P.length > 0 || shake > .4; } };
})();

VIEWS.plinko = v => {
  v.innerHTML = `<div class="pl-board"><div class="pl-inner" id="plInner"><canvas id="plCv"></canvas></div></div>
  <div class="pl-last" id="plLast"></div>
  <div class="panel">

    ${betRowHTML('pl')}
    <button class="bet" id="plBet">Сделать ставку</button>
  </div>`;
  const cv = $('#plCv'), inner = $('#plInner'), ctx = cv.getContext('2d');
  let W, H, dx, dy, y0 = 14, cx, pegR, ballR, slotTop;
  const balls = [], hits = new Map();
  function layout() {
    W = inner.clientWidth; dx = (W - 12) / 13; dy = dx * .92; cx = W / 2; pegR = Math.max(2.4, dx * .13); ballR = Math.max(4, dx * .21);
    slotTop = y0 + 12 * dy - 4; H = Math.round(slotTop + 34);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSlots();
  }
  function drawSlots() {
    $$('.pslot', inner).forEach(e => e.remove());
    const m = PL_M[plRisk];
    m.forEach((x, k) => {
      const d = Math.abs(k - 6) / 6, el = document.createElement('div');
      el.className = 'pslot'; el.id = 'ps' + k; el.textContent = x;
      const w = dx - 3; el.style.width = w + 'px'; el.style.left = (cx + (k - 6) * dx - w / 2) + 'px'; el.style.top = slotTop + 'px';
      el.style.background = `linear-gradient(180deg,hsl(${355 + d * 20} ${45 + d * 45}% ${18 + d * 34}%),hsl(${352} ${40 + d * 45}% ${12 + d * 24}%))`;
      el.style.borderColor = `hsla(8,95%,${58 + d * 20}%,${.15 + d * .5})`;
      inner.appendChild(el);
    });
  }
  const pegX = (r, i) => cx + (i - (r + 2) / 2) * dx, pegY = r => y0 + r * dy;
  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    for (let r = 0; r < 12; r++) for (let i = 0; i < r + 3; i++) {
      const k = r + ':' + i, h = hits.get(k), glow = h ? Math.max(0, 1 - (now - h) / 260) : 0;
      ctx.beginPath(); ctx.arc(pegX(r, i), pegY(r), pegR + glow * 2, 0, Math.PI * 2);
      ctx.fillStyle = glow ? `rgba(255,${200 + 20 * glow},${205 - 60 * glow},1)` : '#f2f0f8';
      ctx.shadowColor = glow ? 'rgba(255,120,130,.9)' : 'rgba(255,255,255,.35)'; ctx.shadowBlur = glow ? 12 : 4; ctx.fill();
    }
    ctx.shadowBlur = 0;
    for (let j = balls.length - 1; j >= 0; j--) {
      const b = balls[j]; b.t += (now - b.last) / 105; b.last = now;
      while (b.t >= 1 && b.seg < 13) { b.t -= 1; b.seg++; if (b.seg <= 12 && b.seg >= 1) { const r = b.seg - 1; if (r < 12) { const idx = Math.round(b.pos[r] + (r + 2) / 2); hits.set(r + ':' + idx, now); } } }
      if (b.seg >= 13) { balls.splice(j, 1); land(b); continue; }
      const P = s => s === 0 ? [cx + b.jit, y0 - dy * 1.1] : s <= 12 ? [cx + b.pos[s - 1] * dx, pegY(s - 1) - pegR - ballR] : [cx + b.pos[12] * dx, slotTop + 4];
      const [x0, yA] = P(b.seg), [x1, yB] = P(b.seg + 1), t = b.t;
      const x = x0 + (x1 - x0) * t, y = yA + (yB - yA) * t * t - (b.seg > 0 ? dy * .32 * 4 * t * (1 - t) : 0);
      b.tr.push(x, y); if (b.tr.length > 16) b.tr.splice(0, 2);
      for (let q = 0; q < b.tr.length - 2; q += 2) { const kk = q / b.tr.length; ctx.globalAlpha = kk * .45; ctx.fillStyle = '#ffb3bd'; ctx.beginPath(); ctx.arc(b.tr[q], b.tr[q + 1], ballR * (.35 + kk * .6), 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
      const gr = ctx.createRadialGradient(x - ballR * .35, y - ballR * .35, 1, x, y, ballR);
      gr.addColorStop(0, '#fff'); gr.addColorStop(.5, '#ffd6f4'); gr.addColorStop(1, '#c08bff');
      ctx.beginPath(); ctx.arc(x, y, ballR, 0, Math.PI * 2); ctx.fillStyle = gr; ctx.shadowColor = 'rgba(180,140,255,.9)'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    }

    const el = $('#ps' + k); if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); const [fx, fy] = FX.at(el); FX.text(fx, fy - 26, m + 'x', m >= 1 ? '#3ee07f' : '#ff7a88'); FX.sparks(fx, fy, m >= 1 ? '#c9a8ff' : '#6b6b80', m >= 2 ? 22 : 8, 3); if (m >= 10) FX.confetti(fx, fy, 90); }

    const last = $('#plLast'); if (last) { last.insertAdjacentHTML('afterbegin', `<span style="${m >= 1 ? 'color:#3ee07f' : ''}">${m}x</span>`); while (last.children.length > 6) last.lastElementChild.remove(); }
  }

  syncRisk();

  cleanup = () => { ro.disconnect(); balls.forEach(b => { const m = PL_M[b.risk][b.pos[12] + 6]; credit(b.stake * m); recordHist('Plinko', b.stake, b.stake * m); }); };
};

/* ---------- пополнение через TON Connect ---------- */
const TONPAY = { ui: null, pending: null, last: '5' };
function tonNano(v) {   // "1.5" -> нанотоны строкой, без ошибок округления
  v = String(v).replace(',', '.').trim();
  if (!/^\d+(\.\d{1,9})?$/.test(v)) return null;
  const [i, f = ''] = v.split('.');
  return (BigInt(i) * 1000000000n + BigInt((f + '000000000').slice(0, 9))).toString();
}
function tonComment(text) {   // текстовый комментарий к переводу (BOC в base64)
  const b = new TextEncoder().encode(text).slice(0, 120), d = new Uint8Array(4 + b.length); d.set(b, 4);
  const cell = new Uint8Array(2 + d.length); cell[1] = d.length * 2; cell.set(d, 2);
  const head = [0xb5, 0xee, 0x9c, 0x72, 1, 1, 1, 1, 0, cell.length, 0], boc = new Uint8Array(head.length + cell.length);
  boc.set(head); boc.set(cell, head.length);
  return btoa(String.fromCharCode(...boc));
}
function tonLib() {
  return new Promise((ok, no) => {
    if (window.TON_CONNECT_UI) return ok();
    const s = document.createElement('script'); s.src = 'https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js';
    s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
}
async function tonUI() {
  if (TONPAY.ui) return TONPAY.ui;
  await tonLib();
  const ui = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: new URL('tonconnect-manifest.json', location.href).href,
    language: 'ru',
    uiPreferences: { theme: TON_CONNECT_UI.THEME.DARK },
    actionsConfiguration: { twaReturnUrl: 'https://t.me/' + CONFIG.botUsername }
  });
  ui.onStatusChange(w => { if (w && TONPAY.pending) { const v = TONPAY.pending; TONPAY.pending = null; tonPay(v); } });
  return (TONPAY.ui = ui);
}
async function tonPay(v) {
  if (CONFIG.tonWallet.includes('ВСТАВЬ')) { toast('Не указан кошелёк для пополнения (tonWallet в index.html)', 'err'); return; }
  const nano = tonNano(v), ton = +String(v).replace(',', '.');
  if (!nano || ton < CONFIG.tonMin) { hap('err'); toast(`Минимум ${CONFIG.tonMin} TON`, 'err'); return; }
  TONPAY.last = String(v);
  let ui;
  try { ui = await tonUI(); } catch (e) { toast('Не удалось загрузить TON Connect, проверь интернет', 'err'); return; }
  if (!ui.connected) { TONPAY.pending = v; ui.openModal(); return; }   // окно со списком кошельков
  const btn = $('#tonPay', sheetEl); if (btn) btn.disabled = true;
  try {
    const msg = { address: CONFIG.tonWallet, amount: nano };
    if (TGU) msg.payload = tonComment('dep:' + TGU.id);
    await ui.sendTransaction({ validUntil: Math.floor(Date.now() / 1000) + 300, messages: [msg] });
    credit(ton); stObj().depTon = +(stObj().depTon + ton).toFixed(4); save(); closeSheet(true); hap('ok'); FX.rain(150); toast(`Оплачено ${f2(ton)} TON`, 'ok');
  } catch (e) { hap('err'); toast('Оплата отменена', 'err'); }
  finally { if (btn) btn.disabled = false; }
}

const GH = {
  get token() { try { return localStorage.getItem('sdelka_gh') || ''; } catch (e) { return ''; } },
  set token(v) { try { if (v) localStorage.setItem('sdelka_gh', v); else localStorage.removeItem('sdelka_gh'); } catch (e) {} },
};
const ghHeaders = () => ({ Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json' });
const ghErr = (st, j) => st === 401 ? 'ключ GitHub не подходит или устарел' : st === 403 ? 'у ключа только чтение. На GitHub открой ключ → Edit → Contents: поменяй Read-only на Read and write → Update' : st === 404 ? 'ключ не видит репозиторий ' + CONFIG.repo : (j && j.message) || 'ошибка ' + st;
async function ghPut(path, obj, msg) {
  const api = `https://api.github.com/repos/${CONFIG.repo}/contents/${path}`;
  let sha;
  const g = await fetch(api + '?ref=main&t=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' });
  if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error(ghErr(g.status, await g.json().catch(() => null)));
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(obj, null, 2))));
  const r = await fetch(api, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg, content, sha, branch: 'main' }) });
  if (!r.ok) throw new Error(ghErr(r.status, await r.json().catch(() => null)));
}

    ${s.games.map(g => `<div class="st-row"><span>${esc(g.name)}</span><span>${g.n}</span><span>${n(g.bet)}</span><span class="${g.bet - g.won >= 0 ? 'pos' : 'neg'}">${n(g.bet - g.won)}</span></div>`).join('') || '<p class="ad-note">Пока никто не играл.</p>'}</div></div>
  <div class="ad-card"><h3>${ic('history')}Кто где выиграл</h3>
    <div class="seg st-f" id="stF">${[['all', 'Все'], ['win', 'Выигрыши'], ['big', 'Крупные']].map(([k, l]) => `<button data-stf="${k}" class="${adStF === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${s.feed.filter(f => adStF === 'all' || (adStF === 'win' ? f.w > f.a : f.w >= Math.max(1, f.a * 5))).slice(0, 60).map(f => {
      const d = f.w - f.a, t = new Date(f.t);
      return `<div class="st-row feed"><span>${esc(f.name)}${f.username ? ` <small>@${esc(f.username)}</small>` : `<small>ID ${f.id}</small>`}</span><span>${esc(f.g)}<small>${t.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })} ${t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</small></span><span>${n(f.a)}<small>ставка</small></span><span class="${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${n(d)}<small>${f.w > 0 ? 'x' + (f.a > 0 ? (f.w / f.a).toFixed(2) : '—') : 'проигрыш'}</small></span></div>`;
    }).join('') || '<p class="ad-note">Пока никто не играл.</p>'}</div>
  <div class="ad-card"><h3>${ic('trophy')}Топ игроков</h3>
    ${s.top.map((p, i) => `<div class="st-row top"><span>${i + 1}. ${esc(p.name)}${p.username ? ` <small>@${esc(p.username)}</small>` : ''}<small>ID ${p.id}</small></span><span>${n(p.dep)} TON<small>пополнил</small></span><span class="${p.won - p.bet > 0 ? 'pos' : 'neg'}">${p.won - p.bet > 0 ? '+' : ''}${n(p.won - p.bet)}<small>выиграл в играх</small></span><span>${n(p.bal)} TON<small>баланс</small></span></div>`).join('') || '<p class="ad-note">Пока пусто.</p>'}
    <p class="ad-note">Обновлено ${new Date(s.t * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}. Оплаты звёздами, присланные подарки и выводы — по данным бота. Ставки, балансы и пополнения TON игроки присылают из мини-аппа.</p></div>`;
}
async function adPublish() {
  if (!GH.token) { adTab = 'access'; renderAdmin(); toast('Сначала добавь ключ GitHub', 'err'); return; }
  const btn = $('[data-pub]'); if (btn) { btn.disabled = true; btn.textContent = 'Публикую…'; }
  try {
    const out = clone(AD); out.updated = new Date().toISOString();
    await ghPut('settings.json', out, 'Админ-панель: настройки');
    adDirty = false; try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    SET_REMOTE = clone(out); hap('ok'); toast('Опубликовано. У игроков обновится примерно через минуту', 'ok');
  } catch (e) { hap('err'); toast('Не получилось: ' + e.message, 'err'); }
  adPubBar();
}
async function ghTest() {
  const st = $('#ghStat'); if (!st) return; st.textContent = 'Проверяю…';
  try {
    const r = await fetch(`https://api.github.com/repos/${CONFIG.repo}`, { headers: ghHeaders(), cache: 'no-store' });
    const j = await r.json().catch(() => null); if (!r.ok) throw new Error(ghErr(r.status, j));
    const c = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/index.html?ref=main`, { headers: ghHeaders(), cache: 'no-store' });
    if (c.status === 403 || c.status === 404) throw new Error('ключ видит репозиторий, но не файлы. Добавь ключу Contents → Read and write');
    st.textContent = '✅ Ключ видит репозиторий и файлы. Если публикация скажет «только чтение» — поменяй у ключа Contents на Read and write.';
  } catch (e) { st.textContent = '❌ ' + e.message; }
}
const numIn = id => parseFloat(String(($('#' + id) || {}).value || '').replace(',', '.'));
VIEWS.admin = v => {
  if (!canOpenAdmin()) { v.innerHTML = `<div class="empty"><span class="eic">${ic('x')}</span><h3>Нет доступа</h3><p>Админ-панель открывается только админам.</p></div>`; return; }
  if (!AD) adLoad();
  v.onclick = e => {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (d.adtab) { adTab = d.adtab; adCaseIdx = -1; if (adTab === 'stats') adSt = null, adStErr = ''; renderAdmin(); window.scrollTo(0, 0); }
    else if (d.streload) { adSt = null; adStErr = ''; renderAdmin(); }
    else if (d.stf) { adStF = d.stf; renderAdmin(); }
    else if (d.pradd) {
      const code = ($('#prCode').value || '').trim(), max = Math.max(1, parseInt($('#prMax').value, 10) || 1);
      if (code.length < 4) { toast('Код — минимум 4 символа', 'err'); return; }
      promoHash(code).then(h => {
        AD.promos = AD.promos || [];
        if (AD.promos.some(p => p.h === h)) { toast('Такой промокод уже есть', 'err'); return; }
        const up = code.toUpperCase();
        AD.promos.push({ id: uid(), h, mask: up.slice(0, 2) + '•'.repeat(Math.max(2, up.length - 3)) + up.slice(-1), max, t: Date.now() });
        adChanged(true); toast(`Промокод ${up} добавлен — не забудь опубликовать`, 'ok');
      }).catch(() => toast('Не получилось зашифровать код (нужен HTTPS)', 'err'));
    }
    else if (d.prdel) { AD.promos.splice(+d.prdel, 1); adChanged(true); }
    else if (d.sw) { setPath(AD, d.sw, !getPath(AD, d.sw)); adChanged(true); }
    else if (d.pub) adPublish();
    else if (d.cedit) { adCaseIdx = +d.cedit; renderAdmin(); window.scrollTo(0, 0); }
    else if (d.cback) { adCaseIdx = -1; renderAdmin(); }
    else if (d.cadd) { AD.cases.push({ id: 'c' + uid(), n: 'Новый кейс', price: 5, glow: '#7b5cff', fb: 'giftbox', badge: '', items: [] }); adCaseIdx = AD.cases.length - 1; adChanged(true); window.scrollTo(0, 0); }
    else if (d.cmv) { const [i, dir] = d.cmv.split(':').map(Number), j = i + dir; if (j < 0 || j >= AD.cases.length) return; [AD.cases[i], AD.cases[j]] = [AD.cases[j], AD.cases[i]]; adChanged(true); }
    else if (d.crm) { const c = AD.cases[adCaseIdx]; c.items = c.items.filter(x => x !== d.crm); adChanged(true); }
    else if (d.cpick) adPickItems();
    else if (d.cdup) { const k = +d.cdup, c = clone(AD.cases[k]); c.id = 'c' + uid(); c.n += ' (копия)'; AD.cases.splice(k + 1, 0, c); adCaseIdx = k + 1; adChanged(true); window.scrollTo(0, 0); }
    else if (d.cdel) {
      if (d.armed) { AD.cases.splice(+d.cdel, 1); adCaseIdx = -1; adChanged(true); toast('Кейс удалён'); }
      else { d.armed = '1'; t.textContent = 'Нажми ещё раз, чтобы удалить'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.innerHTML = ic('x') + 'Удалить кейс'; } }, 3000); }
    }
    else if (d.grant) {
      const u = parseInt(($('#grUid') || {}).value, 10), ton = numIn('grTon');
      if (!(u > 0)) { toast('Впиши Telegram ID игрока', 'err'); return; } if (!ton) { toast('Впиши сумму', 'err'); return; }
      AD.grants.push({ id: uid(), uid: u, ton, note: ($('#grNote').value || '').trim().slice(0, 60), t: Date.now() }); adChanged(true); toast('Добавлено. Теперь нажми «Опубликовать»', 'ok');
    }
    else if (d.grm) { AD.grants = AD.grants.filter(g => g.id !== d.grm); adChanged(true); }
    else if (d.ban) { const u = parseInt(($('#banUid') || {}).value, 10); if (!(u > 0)) { toast('Впиши Telegram ID', 'err'); return; } if (!AD.bans.includes(u)) AD.bans.push(u); adChanged(true); }
    else if (d.unban) { AD.bans = AD.bans.filter(x => +x !== +d.unban); adChanged(true); }
    else if (d.adme) { if (!AD.admins.includes(TG_ID)) AD.admins.push(TG_ID); adChanged(true); }
    else if (d.adadd) { const u = parseInt(($('#admUid') || {}).value, 10); if (!(u > 0)) { toast('Впиши Telegram ID', 'err'); return; } if (!AD.admins.map(Number).includes(u)) AD.admins.push(u); adChanged(true); }
    else if (d.adrm) { AD.admins = AD.admins.filter(x => +x !== +d.adrm); adChanged(true); }
    else if (d.ghsave) { const k = ($('#ghTok').value || '').trim(); if (!k) { toast('Вставь ключ', 'err'); return; } GH.token = k; toast('Ключ сохранён на этом устройстве', 'ok'); renderAdmin(); ghTest(); }
    else if (d.ghtest) ghTest();
    else if (d.ghdel) { GH.token = ''; renderAdmin(); }
    else if (d.exp) copyText(JSON.stringify(AD), 'Настройки скопированы');
    else if (d.reset) {
      if (d.armed) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} AD = clone(SET_REMOTE || DEFAULTS); adDirty = false; applySettings(clone(AD)); adCaseIdx = -1; renderAdmin(); toast('Изменения отменены'); }
      else { d.armed = '1'; t.textContent = 'Нажми ещё раз — вернуть опубликованное'; }
    }
    else if (d.imp) { try { AD = deepMerge(clone(DEFAULTS), JSON.parse($('#impTa').value)); adChanged(true); toast('Настройки загружены', 'ok'); } catch (e2) { toast('Не получилось прочитать текст', 'err'); } }
  };
  v.onchange = e => {
    const t = e.target, d = t.dataset;
    if (d.k) {
      let val = t.value;
      if (t.type === 'number' || d.pct || d.mul) { val = parseFloat(String(t.value).replace(',', '.')); if (!isFinite(val)) { toast('Нужно число', 'err'); renderAdmin(); return; } if (d.pct) val /= 100; if (d.mul) val *= +d.mul; }
      setPath(AD, d.k, val); adChanged(!d.k.startsWith('app.'));
    } else if (d.list) { setPath(AD, d.list, t.value.split(/[,;\s]+/).map(Number).filter(n => n > 0)); adChanged(true); }
    else if (d.pl) { const [k, i] = d.pl.split('.'), x = parseFloat(t.value.replace(',', '.')); if (!(x >= 0)) { toast('Нужно число', 'err'); renderAdmin(); return; } AD.plinko[k][+i] = x; adChanged(true); }
    else if (d.price) { const x = parseFloat(t.value.replace(',', '.')); if (x > 0) AD.prices[d.price] = x; else delete AD.prices[d.price]; adChanged(false); }
  };
  v.oninput = e => { if (e.target.id === 'adQ') { adQ = e.target.value; const l = $('#adPriceList'); if (l) l.innerHTML = adPriceRows(); } };
  cleanup = () => { v.onclick = v.onchange = v.oninput = null; };
  renderAdmin();
};

function loop(now) {
  try { rkUpdate(); pvUpdate(); if (frameHook) frameHook(now); if (FX.busy) FX.frame(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
let booted = false;
function start() { booted = true; go(QS.get('admin') === '1' && canOpenAdmin() ? 'admin' : 'home'); }
async function boot() {
  requestAnimationFrame(loop);
  const t = setTimeout(() => { if (!booted) start(); }, 2500);
  await loadRemote();
  clearTimeout(t);
  if (!booted) start();
  else if (['home', 'hub', 'inventory', 'rating', 'rewards'].includes(cur)) go(cur);
  renderAdminFab();
}
boot();
</script>
</body>
</html>
