<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>SPANIX Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&family=Unbounded:wght@700;800;900&display=swap">
<style>
:root{
  /* Layout: phone shell — sticky balance header, scrolling view with a 16px gutter, fixed 5-tab bar with a raised centre tab */
  --bg:#120709; --bar:#1a0b0e; --card:#221014; --card2:#2e161d; --field:#26121a; --line:#3a1d24;
  --fg:#ffffff; --muted:#b39aa0; --dim:#86686f;
  --acc:#e5243b; --acc-hi:#ff6b7d; --acc-soft:#3a1218; --acc-line:#6b1f2a; --vio:#ff3b4f;
  --gem:#2e9cf2; --gold:#f6b72f; --green:#25c763; --red:#f0414f; --navy:#1c1d2d;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Onest",system-ui,sans-serif;
  --f-disp:"Unbounded","Onest",-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc-hi);outline-offset:2px}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,h4,p{margin:0}
.ic{width:22px;height:22px;flex:none}
.coin,.gem{width:1em;height:1em;flex:none;display:inline-block}
.gift{width:100%;height:100%;display:block;overflow:visible}
.num{font-variant-numeric:tabular-nums}

#app{max-width:480px;margin:0 auto;min-height:100%}
.view{padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px 12px;background:var(--bar);border-bottom:1px solid #3f1f28}
.top.game{background:var(--bg);border-bottom:0;padding:10px 16px}
.ava{width:46px;height:46px;border-radius:50%;padding:2px;background:var(--acc);position:relative;flex:none}
.ava>span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#ffd06a,#ffa451);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava i{position:absolute;right:-5px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:#2a141b;border:2px solid var(--bar);display:grid;place-items:center;color:#c9c9d2}
.ava i .ic{width:12px;height:12px}
.top.game .ava{width:42px;height:42px}
.top.game .ava i{border-color:var(--bg)}
.bal{min-width:0}
.bal small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.bal b{display:flex;align-items:center;gap:7px;font-size:23px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.bal .coin{width:24px;height:24px}
.btn-top{margin-left:auto;display:flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:14px;background:linear-gradient(90deg,#ff3b4f,#d61f3a);font-weight:600;font-size:15px;box-shadow:0 6px 18px -8px rgba(229,36,59,.8);white-space:nowrap}
.btn-top .ic{width:19px;height:19px}
.sq{width:42px;height:42px;border-radius:14px;border:1px solid #3f1f28;background:var(--bar);display:grid;place-items:center;color:#d6d6de;flex:none}
.sq .ic{width:21px;height:21px}
.sq.wide{width:62px;display:flex;justify-content:center;gap:6px}
.sq.sm{width:36px;height:36px;border-radius:12px}
.dot-on{width:9px;height:9px;border-radius:50%;background:#2fd17a;box-shadow:0 0 8px #2fd17a;display:inline-block;flex:none}
.balpill{margin-left:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 4px;border-radius:16px;border:1px solid #3f1f28;background:#1a0c0f}
.balpill .gem-c{width:34px;height:34px;border-radius:50%;background:#2a141b;display:grid;place-items:center}
.balpill .gem-c .gem{width:20px;height:20px}
.balpill .gem-c .coin{width:28px;height:28px}
.balpill b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.balpill .plus{width:34px;height:34px;border-radius:50%;border:1px solid #4d2630;display:grid;place-items:center;color:#d6d6de}
.balpill .plus .ic{width:18px;height:18px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#170a0d;border-top:1px solid #33181f;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:16px;color:#a7a7b0;font-size:11.5px;font-weight:500;text-align:center}
.tab .ic{width:24px;height:24px;stroke-width:1.7}
.tab.on{background:var(--acc-soft);color:var(--acc-hi)}
.tab.on::before{content:"";position:absolute;top:-9px;left:50%;width:34px;height:4px;margin-left:-17px;border-radius:0 0 4px 4px;background:var(--acc)}
.tab.home{background:#28282c;border:1px solid #3a3a40;margin:-8px 4px 0;padding-top:10px}
.tab.home.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.badge{position:absolute;top:1px;left:calc(50% + 4px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#ef3b46;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid #170a0d}

/* ---------- live strip ---------- */
.live{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.live-lbl{display:flex;flex-direction:column;align-items:center;gap:7px;flex:none}
.live-lbl span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:17px;letter-spacing:.02em}
.live-track{display:flex;gap:8px;overflow:hidden;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.drop{width:50px;height:50px;border-radius:11px;flex:none;display:grid;place-items:center;padding:6px}
.drop.in{animation:dropIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dropIn{from{transform:translateX(-30px) scale(.6);opacity:0}}
.t-teal{background:linear-gradient(155deg,#33d6b8,#16a383)}
.t-purple{background:linear-gradient(155deg,#b57bff,#8a45f0)}
.t-gold{background:linear-gradient(155deg,#ffcf3e,#f2a514)}
.drop .coin{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.drop svg.gift{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

/* ---------- banners ---------- */
.bn{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;width:100%;height:102px;border-radius:18px;overflow:hidden;padding:0 16px;margin-top:12px;isolation:isolate}
.bn::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.16) 28% 40%,transparent 40% 60%,rgba(255,255,255,.1) 60% 67%,transparent 67%)}
.bn-title{position:relative;z-index:3;display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:900;font-size:25px;letter-spacing:.01em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.bn-title .ic{width:25px;height:25px;stroke-width:2.3}
.chip{position:relative;z-index:3;display:inline-flex;align-items:center;gap:5px;background:#fff;font-weight:800;font-size:13px;padding:4px 10px 4px 8px;border-radius:8px;letter-spacing:.05em}
.chip .ic{width:15px;height:15px;stroke-width:2.3}
.chip.hit{color:#ff6a1a}
.chip.new{color:#1fae55}
.bn-rocket{background:linear-gradient(105deg,#4c97e6 0%,#78b4f1 55%,#a8d2fa 100%)}
.bn-rocket .art{position:absolute;right:15%;top:-2px;width:82px;height:82px;transform:rotate(40deg);z-index:2;filter:drop-shadow(0 6px 8px rgba(20,60,120,.35))}
.mtag{position:absolute;left:var(--x);top:var(--y);transform:rotate(var(--r));background:#2fc96a;color:#fff;font-weight:800;font-size:12.5px;padding:3px 8px;border-radius:6px;z-index:1;box-shadow:0 2px 0 #1f9a4f;font-family:var(--f-disp)}
.mtag.ghost{background:none;box-shadow:none;opacity:.8}
.bn-pvp{background:linear-gradient(100deg,#ffa30f,#ffbf33 55%,#ffcd4d)}
.pvp-strip{position:absolute;right:0;top:7px;bottom:7px;width:64%;overflow:hidden;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%);mask-image:linear-gradient(90deg,transparent,#000 22%)}
.pvp-row{display:flex;gap:7px;height:100%;width:max-content;animation:pvpRoll 16s linear infinite}
@keyframes pvpRoll{to{transform:translateX(-50%)}}
.pvp-card{width:60px;flex:none;border-radius:12px;background:rgba(58,38,12,.5);border-top:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-weight:800;font-size:9px;text-transform:uppercase}
.pvp-card .av{width:30px;height:30px;font-size:13px}
.pvp-card b{font-size:11.5px}
.pvp-mark{position:absolute;left:54%;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 10px #fff;z-index:2}
.bn-hub{background:linear-gradient(110deg,#4910b4,#6721d6 50%,#7a2fe6)}
.hub-cards{position:absolute;right:-24px;top:0;bottom:0;width:60%;z-index:1}
.hc{position:absolute;top:8px;width:76px;height:104px;border-radius:15px;transform:rotate(12deg);box-shadow:-8px 6px 16px rgba(20,0,60,.35);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-disp);font-weight:800;font-size:11px}
.hc-up{left:4px;background:linear-gradient(160deg,#3ad75d,#13a33f)}
.hc-pl{left:66px;background:linear-gradient(160deg,#a35bff,#6a1fd0)}
.hc-mi{left:128px;background:linear-gradient(160deg,#47a8ff,#1562e2)}
.hc .ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(#fff 0 24%,rgba(255,255,255,.3) 24%);display:grid;place-items:center}
.hc .ring span{width:36px;height:36px;border-radius:50%;background:#28bf4f;display:grid;place-items:center;padding:4px}
.hc .dots{display:grid;grid-template-columns:repeat(4,7px);gap:6px}
.hc .dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9}
.hc .mgrid-mini{display:grid;grid-template-columns:repeat(3,16px);gap:4px}
.hc .mgrid-mini i{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.75)}
.hc .mgrid-mini i.g{background:#2fd06a}

/* ---------- cases ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;font-size:19px;font-weight:700}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.case{display:block;border-radius:22px;background:var(--card);overflow:hidden;border:2px solid transparent;position:relative}
.case.b-gold{border-color:#f5b42a}
.case.b-vio{border-color:#8574e4}
.case.b-green{border-color:#22c25e}
.case-art{display:block;position:relative;aspect-ratio:1/1;overflow:hidden;background:radial-gradient(circle at 50% 52%,var(--g) 0,transparent 48%),#1b1b1e;background:radial-gradient(circle at 50% 52%,color-mix(in srgb,var(--g) 70%,transparent) 0,color-mix(in srgb,var(--g) 18%,transparent) 42%,transparent 70%),#1b1b1e}
.case-art .burst{position:absolute;inset:-20%;background:repeating-conic-gradient(from 8deg,rgba(255,255,255,.07) 0 6deg,transparent 6deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%);mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
.ca{position:absolute;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.ca.main{left:50%;top:52%;width:52%;height:52%;transform:translate(-50%,-50%)}
.titled .ca.main{top:62%;width:46%;height:46%}
.ca.s1{left:5%;top:7%;width:30%;height:30%;transform:rotate(-16deg)}
.ca.s2{right:5%;top:6%;width:28%;height:28%;transform:rotate(14deg)}
.ca.s3{left:5%;bottom:6%;width:30%;height:30%;transform:rotate(10deg)}
.ca.s4{right:5%;bottom:7%;width:29%;height:29%;transform:rotate(-12deg)}
.titled .ca.s1{top:34%;left:4%;width:27%;height:27%}
.titled .ca.s2{top:34%;right:4%;width:27%;height:27%}
.ctitle{position:absolute;left:0;right:0;top:9%;text-align:center;font-family:var(--f-disp);font-weight:900;font-style:normal;font-size:clamp(20px,7.6vw,32px);letter-spacing:-.02em;transform:skewX(-10deg);z-index:2;background:linear-gradient(180deg,#fff 40%,#d8d8e0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.ctitle em{font-style:normal;background:linear-gradient(180deg,#fff27a,#f6b51e);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctitle.t-free{background:linear-gradient(180deg,#b8ffcf,#3ad07a);-webkit-background-clip:text;background-clip:text}
.ctitle.t-farm{background:linear-gradient(180deg,#f3d6ff,#b15cff);-webkit-background-clip:text;background-clip:text}
.cbadge{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px;letter-spacing:.08em;padding:5px 10px;border-radius:10px;color:#fff}
.cbadge .ic{width:14px;height:14px;stroke-width:2.3}
.cbadge.new{left:6%;top:5%;background:linear-gradient(90deg,#ffb21a,#ff7a1a);box-shadow:0 3px 0 #c95a0a}
.cbadge.lim{left:4%;right:4%;top:4%;justify-content:center;background:linear-gradient(180deg,#9e2a2a,#6f1414);border:1px solid #c94a3a;border-radius:14px}
.case-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 10px 12px 14px}
.cname{font-size:15px;font-weight:600;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cbtn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:17px;font-weight:700;font-size:16px;background:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.cbtn .coin{width:18px;height:18px}
.cbtn .ic{width:17px;height:17px}
.cbtn.y{background:linear-gradient(90deg,#ffc21a,#f6a40e);color:#fff}
.cbtn.g{background:linear-gradient(90deg,#1fc25f,#18a852)}
.cbtn.cd{font-size:13px;padding:0 10px;background:#34343a;color:#d5d5dd}

/* ---------- hub ---------- */
.bn-up{height:138px;background:linear-gradient(108deg,#26c840,#4fdc58 55%,#7ae872);gap:6px;justify-content:flex-end;padding-bottom:16px}
.bn-up .chip{position:absolute;left:16px;top:14px}
.bn-up h2{position:relative;z-index:3;font-family:"Onest",var(--f-ui);font-weight:900;font-size:31px;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,80,10,.25)}
.bn-up p{position:relative;z-index:3;font-weight:600;font-size:15px;color:rgba(255,255,255,.82)}
.up-ring{position:absolute;right:14px;top:50%;width:112px;height:112px;margin-top:-56px;border-radius:50%;background:conic-gradient(from 20deg,#fff 0 24%,rgba(255,255,255,.28) 24% 100%);display:grid;place-items:center;z-index:2;box-shadow:0 0 0 14px rgba(255,255,255,.1)}
.up-ring>span{width:86px;height:86px;border-radius:50%;background:#46d257;display:grid;place-items:center;padding:12px}
.up-ring b{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%) rotate(-4deg);background:#fff;color:#18b24a;font-family:var(--f-disp);font-weight:900;font-size:16px;padding:1px 7px;border-radius:7px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{position:relative;height:152px;border-radius:20px;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.tile h3{font-family:"Onest",var(--f-ui);font-weight:900;font-size:27px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.tile p{font-weight:600;font-size:13px;color:rgba(255,255,255,.72);position:relative;z-index:2}
.tile .chip{font-size:11px;padding:2px 7px}
.t-mines{background:linear-gradient(160deg,#16a4ff,#0b6ff0)}
.t-plinko{background:linear-gradient(160deg,#8a37f0,#5815b8)}
.t-craft{background:linear-gradient(160deg,#ff4a3a,#ff7f1c)}
.t-dice{background:linear-gradient(160deg,#2366f2,#0d2fa8)}
.tile-art{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:44px;z-index:1}
.mm{display:grid;grid-template-columns:repeat(3,26px);gap:5px}
.mm i{width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#dff1ff,#a8d6ff);box-shadow:inset 0 -3px 0 rgba(30,90,180,.25)}
.mm i.g{background:linear-gradient(180deg,#46e07a,#1fb052);padding:3px}
.pk{display:flex;flex-direction:column;align-items:center;gap:7px}
.pk div{display:flex;gap:13px}
.pk i{width:8px;height:8px;border-radius:50%;background:#efe6ff}
.pk .slots{gap:4px}
.pk .slots i{width:17px;height:9px;border-radius:3px;background:rgba(255,255,255,.22)}
.cr-box{width:72px;height:72px;border-radius:20px;background:linear-gradient(180deg,#ffe2d6,#ffb79a);padding:10px;box-shadow:0 8px 18px rgba(120,20,0,.35)}
.tile-art svg.dice{width:74px;height:74px;filter:drop-shadow(0 8px 10px rgba(0,0,30,.5))}

/* ---------- common panels & bet controls ---------- */
.panel{background:#1d0d11;border-radius:22px;padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:#26121a;border-radius:16px;padding:4px}
.seg button{flex:1;height:44px;border-radius:13px;font-weight:600;font-size:16px;color:#c9c9d1;text-align:center}
.seg button.on{background:var(--vio);color:#fff}
.betrow{display:flex;gap:10px;align-items:stretch}
.mode{display:flex;background:#26121a;border-radius:22px;padding:4px;gap:2px;flex:none}
.mode button{width:50px;height:44px;border-radius:18px;display:grid;place-items:center;color:#c9c9d1}
.mode button.on{background:var(--vio);color:#fff}
.mode .gem{width:22px;height:22px}
.amt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#211014;border:1px solid #3c1e26;border-radius:18px;padding:0 14px;height:52px}
.amt input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.amt input::placeholder{color:#a8898f;font-weight:600}
.amt .gem{width:20px;height:20px}
.amt.big{height:56px}
.bet{width:100%;height:52px;border-radius:16px;background:#2b141b;color:#6f6f79;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:filter .15s,transform .1s}
.bet.ok{background:linear-gradient(90deg,#e11d48,#ff3b4f);color:#fff;box-shadow:0 8px 22px -10px rgba(255,59,79,.9)}
.bet.ok:active{transform:scale(.985)}
.bet.cash{background:linear-gradient(90deg,#1fc25f,#38d97a);color:#fff}
.bet.alt{background:var(--acc);color:#fff}
.bet.ghost{background:#2b141b;color:#e0e0e6}
.bet .ic{width:20px;height:20px}
.bet small{font-weight:600;opacity:.85;font-size:15px}

/* ---------- plinko ---------- */
.pl-board{margin-top:16px;border-radius:20px;padding:12px 8px 10px;border:1px solid #3b3463;background:radial-gradient(ellipse 50% 70% at 0% 55%,rgba(229,36,59,.5),transparent),radial-gradient(ellipse 50% 70% at 100% 55%,rgba(229,36,59,.5),transparent),repeating-linear-gradient(125deg,rgba(255,255,255,.025) 0 2px,transparent 2px 10px),#1c1a27}
.pl-inner{position:relative}
.pl-inner canvas{display:block;width:100%}
.pslot{position:absolute;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12.5px;letter-spacing:-.02em;color:#fff;border:1.5px solid rgba(255,255,255,.18);font-variant-numeric:tabular-nums;transition:transform .15s}
.pslot.bump{animation:bump .35s}
@keyframes bump{40%{transform:translateY(6px);filter:brightness(1.6)}}
.pl-last{display:flex;gap:6px;justify-content:center;min-height:26px;margin-top:10px}
.pl-last span{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:#2b2840;color:#cbbdff}

/* ---------- dice ---------- */
.dt{position:relative;isolation:isolate;margin-top:20px;background:#170a0d;border:1px solid #2e161d;border-radius:24px;padding:16px 18px 24px}
.dt-range{color:#7c7c86;font-size:15px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.dt-scale{display:flex;justify-content:space-between;color:#a9a9b2;font-weight:600;font-size:14px;margin-bottom:8px}
.dt-scale span{display:flex;flex-direction:column;align-items:center;gap:3px;width:28px}
.dt-scale span::after{content:"";border:5px solid transparent;border-top:6px solid #6e6e78;border-bottom:0}
.dt-track{--t:50%;position:relative;height:22px;border-radius:11px;margin:16px 0 0;touch-action:none;background:linear-gradient(90deg,#ff2d4f,#c4183a var(--t),#10a44a var(--t),#18e46e)}
.dt-track.under{background:linear-gradient(90deg,#18e46e,#10a44a var(--t),#c4183a var(--t),#ff2d4f)}
.dt-track::before{content:"";position:absolute;inset:-8px 0;border-radius:20px;background:inherit;filter:blur(16px);opacity:.55;z-index:-1}
.dt-track::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(118deg,rgba(255,255,255,.16) 0 3px,transparent 3px 10px)}
.dt-thumb{position:absolute;top:50%;left:var(--t);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5);display:grid;place-items:center;z-index:2;cursor:grab}
.dt-thumb::after{content:"";width:24px;height:24px;border-radius:50%;background:#5a4fd6}
.dt-roll{position:absolute;bottom:34px;left:var(--r);transform:translateX(-50%);padding:5px 9px;border-radius:9px;font-weight:800;font-size:15px;color:#fff;transition:left .5s cubic-bezier(.2,.9,.3,1);z-index:3;font-variant-numeric:tabular-nums}
.dt-roll::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:inherit;border-bottom:0}
.dt-roll.win{background:#18c25c;border-color:#18c25c}
.dt-roll.lose{background:#e23246;border-color:#e23246}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fld{display:block;min-width:0}
.fld>span:not(.fbox){display:block;color:#a9a9b2;font-size:16px;margin-bottom:8px}
.fbox{display:flex;align-items:center;height:56px;border-radius:18px;background:#1a0c0f;border:1px solid #33181f;padding:0 14px 0 18px;gap:8px}
.fbox input{flex:1;min-width:0;width:100%;background:none;border:0;outline:none;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.fbox .ic{width:22px;height:22px;color:#a9a9b2}
.fbox button{color:#c9c9d1;display:grid;place-items:center}

/* ---------- mines ---------- */
.mul-row{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:2px;scrollbar-width:none}
.mul-row::-webkit-scrollbar{display:none}
.mul-row span{flex:none;height:32px;padding:0 11px;border-radius:10px;background:#200e12;border:1px solid #2e2e33;display:grid;place-items:center;font-weight:700;font-size:15px;color:#c9c9d1;font-variant-numeric:tabular-nums}
.mul-row span.done{color:#666670}
.mul-row span.now{background:#2b2558;border-color:#d81f36;color:#fff}
.mul-row span.max{background:#3a3214;border-color:#c7a12a;color:#ffd84a}
.mn-board{margin-top:12px;background:#1d0d11;border-radius:24px;padding:12px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.mt{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(180deg,#38383d,#2d2d32);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.25);display:grid;place-items:center;color:#46464d;padding:22%;transition:transform .12s}
.mt .ic{width:100%;height:100%;stroke-width:1.6}
.mt:active{transform:scale(.94)}
.mt.gemt{background:linear-gradient(180deg,#2fd47a,#17a456);padding:14%;animation:pop .3s}
.mt.bomb{background:linear-gradient(180deg,#5a1f27,#3a1219);padding:12%;animation:pop .3s}
.mt.dim{opacity:.45;animation:none}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}}
.msel{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border-radius:18px;background:#211014;border:1px solid #3c1e26;font-weight:700;font-size:19px}
.msel svg{width:26px;height:26px}
.msel .ic{width:18px;height:18px;color:#a9a9b2}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.numgrid button{height:46px;border-radius:12px;background:#26121a;font-weight:700;font-size:17px;text-align:center}
.numgrid button.on{background:var(--vio)}

/* ---------- rocket ---------- */
.rk-stage{position:relative;height:270px;margin:4px -16px 0;overflow:hidden}
.rk-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.rk-cd{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(246,183,47,.35),rgba(246,183,47,.08) 55%,transparent 70%)}
.rk-cd svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rk-cd circle{fill:none;stroke-width:9;stroke-linecap:round}
.rk-cd .tr{stroke:rgba(255,255,255,.08)}
.rk-cd .ar{stroke:#fbbf24;stroke-dasharray:565.5;filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
.rk-cd b{font-family:"Onest",var(--f-ui);font-weight:900;font-size:96px;line-height:1;position:relative}
.rk-rocket{position:absolute;left:0;top:0;width:62px;height:62px;margin:-31px 0 0 -31px;will-change:transform}
.rk-rocket .fl{position:absolute;left:50%;top:84%;width:16px;height:30px;margin-left:-8px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;background:linear-gradient(#fff3b0,#ffae1f 45%,transparent);filter:blur(1px);animation:flick .12s infinite alternate;transform-origin:top}
@keyframes flick{to{transform:scaleY(.75)}}
.rk-mul{position:absolute;left:0;right:0;top:26px;text-align:center}
.rk-mul b{display:block;font-family:"Onest",var(--f-ui);font-weight:900;font-size:58px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.rk-mul span{font-weight:700;font-size:16px;color:var(--muted)}
.rk-mul.crashed b{color:#ff4d5e}
.rk-hist{display:flex;gap:8px;overflow:hidden;margin-top:6px}
.hp{flex:none;height:34px;padding:0 12px;border-radius:12px;display:grid;place-items:center;font-family:"Onest",var(--f-ui);font-weight:800;font-size:15px;border:2px solid;font-variant-numeric:tabular-nums}
.hp.lo{background:#15291c;border-color:#2c8a4a;color:#e9fff0}
.hp.mid{background:#26193f;border-color:#8a5ad8;color:#efe6ff}
.hp.hi{background:#2e2610;border-color:#c7951b;color:#fff3cc}
.hp.state{background:#173055;border-color:#3b82f6;color:#fff;box-shadow:0 0 12px rgba(59,130,246,.45)}
.rk-btn{width:100%;height:62px;margin-top:12px;border-radius:20px;background:linear-gradient(90deg,#0ea5e9,#2563eb);font-weight:800;font-size:21px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.rk-btn small{font-size:13px;font-weight:600;opacity:.85}
.rk-btn.cash{background:linear-gradient(90deg,#16a34a,#22c55e)}
.rk-btn.wait{background:#24324a;color:#cfe0ff}
.listbox{margin-top:12px;background:#170a0d;border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:10px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:#253033;border:1px solid #2f4245}
.brow.me{border-color:#d81f36;background:#262440}
.brow.lost{opacity:.55}
.brow .av{width:44px;height:44px;font-size:18px;border-radius:12px}
.brow .who{flex:1;min-width:0}
.brow .who b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:3px 9px;border-radius:9px;background:#1e2a2c;color:#7fc8ff;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mini .coin{width:15px;height:15px}
.rpill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:14px;background:#1d2a2d;color:#7fc8ff;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.rpill .coin{width:18px;height:18px}
.rpill.won{color:#3ee07f;background:#163322}
.empty-row{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- pvp ---------- */
.pv-stats{display:grid;grid-template-columns:1fr 1px 1fr;gap:14px;padding:12px 0 14px;border-bottom:1px solid #2c2c32}
.pv-stats .sep{background:#381b22}
.pv-stat .r1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:600;font-size:16px}
.pv-stat .r1 b{color:#3aa2ff;font-weight:700;white-space:nowrap}
.pv-stat .r1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv-stat .r2{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:4px}
.pv-arena{position:relative;height:250px;margin:0 -16px;overflow:hidden}
.pv-tile{position:absolute;width:74px;height:70px;margin:-35px 0 0 -37px;border-radius:18px;background:#29292d;border-top:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;color:#e9e9ef;box-shadow:0 6px 16px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.pv-tile .coin{width:34px;height:34px}
.pv-tile.in{animation:tileIn .4s}
@keyframes tileIn{from{opacity:0;scale:.6}}
.pv-center{position:absolute;left:0;right:0;bottom:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.live-pill{padding:6px 18px;border-radius:14px;background:#183028;border:1.5px solid #2c6b4c;font-family:var(--f-disp);font-weight:800;letter-spacing:.25em;font-size:15px;color:#eafff3}
.live-pill.wait{background:#2b2a17;border-color:#7a6a1c;color:#fff4c2;letter-spacing:.08em}
.pv-center small{color:#a8898f;letter-spacing:.14em;font-weight:600;font-size:13px;margin-top:4px}
.pv-center b{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.pv-center b .coin{width:28px;height:28px}
.pv-center em{font-style:normal;color:#77777f;font-size:13px;font-variant-numeric:tabular-nums}
.pv-reel{position:relative;height:150px;margin:0 -16px;background:#1a0c0f;overflow:hidden}
.pv-track{position:absolute;left:0;top:10px;display:flex;gap:10px;will-change:transform}
.pv-card{width:112px;height:130px;flex:none;border-radius:18px;background:#2a2a2f;border-top:4px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700}
.pv-card .av{width:56px;height:56px;font-size:22px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.pv-card span{font-size:15px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-card b{font-size:19px;font-variant-numeric:tabular-nums}
.pv-card.win{background:#2c2a4a;box-shadow:0 0 0 2px #e5243b inset}
.pv-mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#2e9cf2;box-shadow:0 0 12px #2e9cf2;z-index:2}
.pv-mark::before,.pv-mark::after{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
.pv-mark::before{top:0;border-top:12px solid #2e9cf2;border-bottom:0}
.pv-mark::after{bottom:0;border-bottom:12px solid #2e9cf2;border-top:0}
.pv-join{margin-top:16px;height:60px;border-radius:20px;background:linear-gradient(90deg,#3b4d7a,#2d3d66);font-weight:800;font-size:20px;color:#fff}
.pv-join[disabled]{background:#252b3c;color:#6d7a99}
.prow-h{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px;font-weight:700;font-size:19px}
.prow-h span{display:flex;align-items:center;gap:6px;color:#a8898f;font-size:17px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#221014;border-left:4px solid var(--c);margin-bottom:8px}
.prow.me{background:#2a2840}
.prow .av{width:50px;height:50px;font-size:20px;box-shadow:0 0 0 3px var(--c)}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tag{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 9px;border-radius:9px;border:1.5px solid #2b5c8f;background:#182436;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.prow .tag .coin{width:15px;height:15px}
.prow .pct{text-align:right;font-variant-numeric:tabular-nums}
.prow .pct b{display:block;font-size:21px}
.prow .pct small{color:#a8898f;font-size:14px}

/* ---------- upgrade ---------- */
.up-card{margin-top:16px;border-radius:24px;padding:16px;background:radial-gradient(circle at 10% 10%,rgba(40,210,120,.13),transparent 40%),#200e12;border:1px solid #33181f}
.up-head{display:flex;gap:12px;align-items:center}
.up-ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#2fe08a,#13b866);display:grid;place-items:center;flex:none;box-shadow:0 6px 20px rgba(30,210,120,.35)}
.up-ic .ic{width:24px;height:24px;stroke-width:2.4}
.up-head h2{font-size:21px;font-weight:800}
.up-head p{color:#33d68a;font-size:14px;margin-top:2px}
.up-slots{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:8px;margin-top:16px}
.up-col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.up-lbl{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:12px;border:1px solid #1f6b46;background:#1b3328;color:#3ee08f;font-weight:700;font-size:14px;white-space:nowrap}
.up-lbl i{width:20px;height:20px;border-radius:50%;background:#22c56c;color:#0c2a1b;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.up-lbl.dis{border-color:#3f1f28;background:#211014;color:#9a9aa4}
.up-lbl.dis i{background:#56565f;color:#1a0c0f}
.up-slot{width:100%;aspect-ratio:.8;border-radius:18px;border:2px dashed #2a7a52;background:#232a27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.up-slot.dis{border-color:#3d3d45;background:#242427}
.up-slot .plus{width:46px;height:46px;border-radius:12px;border:1px solid #2a7a52;background:#1f3a2c;display:grid;place-items:center;color:#3ee08f}
.up-slot.dis .plus{border-color:#45454d;background:#2c2c30;color:#a8898f}
.up-slot b{font-size:16px;color:#3ee08f}
.up-slot.dis b{color:#9a9aa4}
.up-slot small{font-size:12.5px;color:#2fb874;line-height:1.3}
.up-slot.dis small{color:#6e6e78}
.up-slot .gift{width:64%;height:auto;aspect-ratio:1;flex:none}
.up-slot .gv{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:#fff;font-variant-numeric:tabular-nums}
.up-slot .gv .coin{width:15px;height:15px}
.up-bolt{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7af0b0,#1cc066);display:grid;place-items:center;box-shadow:0 0 20px rgba(40,220,120,.55);color:#0f5a32}
.up-bolt .ic{width:22px;height:22px;stroke-width:2.3}
.up-wheel-wrap{position:relative;width:min(84vw,320px);aspect-ratio:1;margin:26px auto 0}
.up-pointer{position:absolute;left:50%;top:-6px;width:20px;height:32px;margin-left:-10px;z-index:3;background:linear-gradient(#ffe066,#f2a20f);clip-path:polygon(50% 100%,0 30%,20% 0,80% 0,100% 30%);filter:drop-shadow(0 0 8px rgba(255,200,60,.7))}
.up-outer{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 64%,#1b2537 64.5%,#2e3b52 70%,#3d4a62 100%);box-shadow:0 0 0 1px #4b5872 inset}
.up-ticks{position:absolute;inset:3%;border-radius:50%;background:repeating-conic-gradient(rgba(200,210,230,.5) 0 .8deg,transparent .8deg 12deg);-webkit-mask-image:radial-gradient(circle,transparent 92%,#000 93%);mask-image:radial-gradient(circle,transparent 92%,#000 93%)}
.up-wheel{position:absolute;inset:11%;border-radius:50%;--ch:100%;background:repeating-conic-gradient(rgba(0,0,0,.24) 0 .5deg,transparent .5deg 2.2deg),conic-gradient(#1ed27f 0 var(--ch),#273349 var(--ch) 100%);box-shadow:0 0 30px rgba(30,210,127,.25)}
.up-center{position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,#2a3a4a,#1f2b39);border:4px solid #34465a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center}
.up-center b{font-family:"Onest",var(--f-ui);font-weight:900;font-size:clamp(20px,6.8vw,28px);color:#2fe08f;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.up-center span{font-weight:800;font-size:12px;letter-spacing:.16em;color:#c8d3e6;margin-top:2px;line-height:1.2}
.up-go{margin-top:20px}

/* ---------- craft ---------- */
.cr-card{margin-top:16px;border-radius:24px;padding:16px;background:radial-gradient(circle at 10% 10%,rgba(255,110,40,.16),transparent 45%),#200e12;border:1px solid #33181f}
.cr-card .up-ic{background:linear-gradient(160deg,#ff8a3a,#ff4a2a);box-shadow:0 6px 20px rgba(255,90,40,.35)}
.cr-card .up-head p{color:#ff9a63}
.cr-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.cr-slot{aspect-ratio:1;border-radius:16px;border:2px dashed #5a3a2c;background:#2a2321;display:grid;place-items:center;color:#a8664a;padding:14%}
.cr-slot.full{border-style:solid;border-color:#ff8a3a;background:#33261f}
.cr-slot .ic{width:26px;height:26px}
.cr-sum{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:14px;color:var(--muted)}
.cr-sum b{color:#fff;font-variant-numeric:tabular-nums}

/* ---------- inventory & gift cards ---------- */
.pg-h{font-size:31px;font-weight:800;margin:14px 0 6px;letter-spacing:-.01em}
.inv-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px;color:var(--muted)}
.inv-sum b{color:#fff}
.inv-sum button{height:36px;padding:0 14px;border-radius:12px;background:#2b141b;font-weight:600;font-size:14px}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 10px;border-radius:18px;background:#221014;border:1.5px solid #33181f;text-align:center}
.gcard .gwrap{width:70%;aspect-ratio:1;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.gcard b{font-size:13.5px;font-weight:600}
.gcard.sel{border-color:#ff8a3a;background:#33261f}
.gcard.sel::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:#ff8a3a;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.vpill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:9px;background:var(--acc-soft);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.vpill .coin{width:14px;height:14px}
.gcard.t-teal{background:radial-gradient(circle at 50% 30%,rgba(51,214,184,.22),transparent 60%),#262629}
.gcard.t-purple{background:radial-gradient(circle at 50% 30%,rgba(181,123,255,.25),transparent 60%),#262629}
.gcard.t-gold{background:radial-gradient(circle at 50% 30%,rgba(255,207,62,.25),transparent 60%),#262629}
.gcard.t-teal.sel,.gcard.t-purple.sel,.gcard.t-gold.sel{background:#33261f}
.empty{margin:44px 0 0;padding:28px 22px 30px;border-radius:26px;background:#221014;border:1px solid #33181f;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.empty .eic{width:64px;height:64px;border-radius:50%;background:#303034;display:grid;place-items:center}
.empty .eic .coin{width:36px;height:36px;opacity:.75}
.empty h3{font-size:24px;font-weight:800}
.empty p{color:#c0c0c8;font-size:16px;line-height:1.5}
.empty p a{color:#fff;text-decoration:underline;font-weight:600}
.empty .note{color:#a8898f;font-size:14px}
.or{display:flex;align-items:center;gap:12px;width:100%;color:#a8898f;font-size:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#3a1d24}

/* ---------- invite ---------- */
.ref-card{position:relative;margin-top:16px;border-radius:24px;padding:22px 18px;background:#2a2a30;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ref-ic{width:68px;height:68px;border-radius:18px;background:linear-gradient(160deg,#9283ee,#7563dc);display:grid;place-items:center}
.ref-ic .ic{width:34px;height:34px}
.ref-card h2{font-size:23px;font-weight:800;line-height:1.25;text-wrap:balance}
.ref-card h2 em{display:block;font-style:normal;color:var(--acc-hi);font-size:28px}
.ref-card p{color:var(--muted);font-size:15px;margin-top:4px}
.ref-card .also{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-weight:700;font-size:16px}
.tk{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;background:#3a3660;color:var(--acc-hi);font-weight:800;font-variant-numeric:tabular-nums}
.tk .ic{width:17px;height:17px;fill:currentColor;stroke:none}
.ref-card .help{position:absolute;right:14px;top:14px}
.btn-col{margin-top:16px;padding:14px;border-radius:24px;background:#221014;display:flex;flex-direction:column;gap:10px}
.stats{margin-top:16px;border-radius:24px;background:#221014;padding:4px 18px}
.stats div{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:17px;color:#c0c0c8}
.stats div+div{border-top:1px solid #381b22}
.stats b{display:flex;align-items:center;gap:8px;font-size:21px;color:var(--acc-hi);font-variant-numeric:tabular-nums}
.stats b .coin{width:22px;height:22px}
.stats b .ic{width:22px;height:22px;fill:currentColor;stroke:none}
.refs{margin-top:16px;border-radius:24px;background:#221014;padding:18px}
.refs h3{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.refs h3 span{padding:2px 12px;border-radius:12px;background:#34343c;font-size:16px;color:#c9c9d1}
.refs p{color:var(--muted);font-size:14px;margin-top:12px;line-height:1.5}

/* ---------- rating ---------- */
.rt-card{position:relative;overflow:hidden;margin-top:16px;border-radius:24px;padding:18px;background:linear-gradient(160deg,#20223a,#151627);border:1px solid #2d2f4b}
.rt-card .wm{position:absolute;right:-16px;top:28px;width:150px;height:150px;opacity:.12}
.rt-top{display:flex;align-items:center;gap:12px;position:relative}
.rt-top .ti{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#9283ee,#7563dc);display:grid;place-items:center}
.rt-top .ti .ic{width:26px;height:26px}
.rt-top h2{font-size:24px;font-weight:800}
.rt-top .sq{margin-left:auto;background:#2a2850;border-color:#6b1f2a;color:var(--acc-hi)}
.rt-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:16px;position:relative}
.rt-mid small{display:block;color:#f6c94a;font-weight:600;font-size:14px;margin-bottom:8px}
.rt-timer{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:#3b2c22;border:1.5px solid #8a6420;color:#fbbf24;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt-timer .ic{width:20px;height:20px}
.rt-prz{text-align:right}
.rt-prz small{color:#a9a9c0;font-weight:500;margin-bottom:6px}
.rt-prz b{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:24px}
.rt-prz b .ic{width:22px;height:22px;color:var(--acc-hi)}
.rt-card p{position:relative;text-align:center;color:#c0c0d0;font-size:15px;line-height:1.5;margin-top:16px;text-wrap:balance}
.rt-h{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-weight:800;font-size:21px}
.rt-h .ic{color:var(--acc-hi);width:24px;height:24px}
.rt-h .cols{margin-left:auto;display:flex;gap:26px;color:#a8898f;font-weight:500;font-size:15px}
.rt-h button{color:var(--acc-hi);display:grid}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:#221014;border:1.5px solid #33181f;margin-bottom:8px}
.rrow.r1{background:linear-gradient(90deg,#4d4420,#3d3416);border-color:#7a6a22}
.rrow.r2{background:linear-gradient(90deg,#45464b,#393a3f);border-color:#66676d}
.rrow.r3{background:linear-gradient(90deg,#4b3020,#3c2416);border-color:#6f4527}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:#381b22;color:#d6d6de}
.r1 .rk{background:radial-gradient(circle at 35% 30%,#ffd54a,#f08c0a);color:#fff;box-shadow:0 0 0 2px #c7a12a}
.r2 .rk{background:radial-gradient(circle at 35% 30%,#d8dde6,#8a94a6);color:#fff;box-shadow:0 0 0 2px #a7adb8}
.r3 .rk{background:radial-gradient(circle at 35% 30%,#ffa45a,#d8601a);color:#fff;box-shadow:0 0 0 2px #b8662a}
.rrow .av{width:42px;height:42px;font-size:17px}
.rrow .nm{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm .you{display:inline-block;padding:2px 9px;border-radius:8px;background:#3a3660;color:var(--acc-hi);font-size:14px;font-weight:800}
.rprize{width:44px;height:44px;border-radius:12px;background:#2a141b;border:1px solid #3f1f28;padding:6px;flex:none;display:grid;place-items:center;color:#a8898f}
.rprize .ic{width:20px;height:20px}
.rpts{min-width:64px;height:40px;padding:0 10px;border-radius:12px;background:#3c3555;border:1px solid #574c84;display:grid;place-items:center;color:var(--acc-hi);font-weight:800;font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.r2 .rpts,.rrow.meRow .rpts{background:#33325a}
.rrow.meRow{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#26121a;border-color:#3f1f28;box-shadow:0 -10px 24px rgba(0,0,0,.45);z-index:5}

/* ---------- rewards ---------- */
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tabs2 button{height:54px;border-radius:18px;background:#26121a;color:#c0c0c8;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:9px;position:relative}
.tabs2 button.on{background:var(--acc);color:#fff}
.tabs2 .ic{width:22px;height:22px}
.tabs2 .badge{position:static;margin-left:2px;border:0;height:22px;min-width:22px}
.tix{margin-top:16px;display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:linear-gradient(160deg,#20223a,#191a2a);border:1px solid #2d2f4b}
.tix .ti{width:54px;height:54px;border-radius:16px;background:#3a3462;display:grid;place-items:center;color:#e5243b}
.tix .ti .ic{width:28px;height:28px;fill:currentColor;stroke:none}
.tix small{display:block;color:#a9a9c0;font-size:15px}
.tix b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tix b span{color:#a8898f;font-size:16px;font-weight:500;margin-left:8px}
.tix button{margin-left:auto;color:#a9a9b2}
.tix button .ic{width:26px;height:26px}
.tasks{margin-top:16px;padding:14px 12px 4px;border-radius:24px;background:#221014}
.tasks h4{display:flex;align-items:center;gap:8px;color:#a9a9b2;font-size:14px;font-weight:700;letter-spacing:.08em;padding:2px 6px 12px}
.tasks h4 .ic{width:18px;height:18px}
.task{position:relative;padding:14px;border-radius:20px;background:#170a0d;margin-bottom:10px}
.task .tt{position:absolute;right:14px;top:12px;display:flex;align-items:center;gap:5px;color:#fbbf24;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.task .tt .ic{width:16px;height:16px}
.task .r1{display:flex;align-items:center;gap:14px;margin-top:16px}
.task .r1 .ti{width:44px;height:44px;border-radius:14px;background:#3a1218;display:grid;place-items:center;color:#8f80ea;flex:none}
.task .r1 .ti .ic{width:24px;height:24px}
.task .r1 b{font-size:17px;font-weight:600;line-height:1.3;flex:1}
.task .r1 .q{color:#e5243b}
.task .r2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.task .rw{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;background:#24233a;border:1.5px solid #3a3762;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.task .rw .ic{width:22px;height:22px;fill:#8f80ea;stroke:none}
.task .go{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:14px;background:var(--acc);font-weight:600;font-size:16px}
.task .go .ic{width:19px;height:19px}
.task .go.claim{background:linear-gradient(90deg,#1fc25f,#18a852)}
.task .go.done{background:#2b141b;color:#a8898f}
.bar{height:6px;border-radius:3px;background:#2e2e33;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e5243b,#ff6b7d);border-radius:3px}
.task .r3{display:flex;justify-content:space-between;margin-top:8px;color:#a8898f;font-size:14px;font-variant-numeric:tabular-nums}
.gw{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:14px;border-radius:20px;background:#170a0d;margin-bottom:10px}
.gw .gimg{width:76px;height:76px;border-radius:18px;padding:10px}
.gw h5{font-size:17px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.gw .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.gw .meta span{display:inline-flex;align-items:center;gap:4px}
.gw .meta .ic{width:15px;height:15px}
.gw .meta .y{color:#fbbf24}
.gw .go{grid-column:1/-1}

/* ---------- sheet / toast / misc ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:480px;max-height:86%;overflow-y:auto;background:#170a0d;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sheet.tall{max-height:93%}
.sheet>*{flex-shrink:0}
.sheet-wrap.show .sheet-bg{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:#3c3c44;margin:0 auto 2px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-t{font-size:21px;font-weight:800}
.sh-p{color:#b0b0ba;font-size:14.5px;line-height:1.5}
.sh-bal{color:var(--muted);font-size:14px}
.sh-bal b{color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;min-width:58px;height:40px;border-radius:12px;background:#26121a;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.topup-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.topup-grid button{height:64px;border-radius:16px;background:#26121a;display:flex;align-items:center;justify-content:center;gap:6px;font-size:21px;font-weight:800}
.topup-grid .coin{width:20px;height:20px}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#221014}
.hrow div{flex:1;min-width:0}
.hrow b{display:block;font-size:15px}
.hrow small{color:var(--muted);font-size:13px}
.hrow span{font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:#3ee07f}.neg{color:#ff6070}
.cs-art{width:150px;height:150px;margin:0 auto;border-radius:24px;overflow:hidden}
.cs-art .case-art{height:100%}
.reel{position:relative;height:118px;margin:0 -16px;overflow:hidden;background:#18181b;border-block:1px solid #2c2c32}
.reel-track{position:absolute;left:0;top:10px;display:flex;gap:8px;will-change:transform}
.rtile{width:96px;height:96px;flex:none;border-radius:16px;padding:14px;display:grid;place-items:center}
.reel .pv-mark{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.reel .pv-mark::before{border-top-color:var(--gold)}.reel .pv-mark::after{border-bottom-color:var(--gold)}
.cs-items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ci{border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#221014}
.ci .gwrap{width:58%;aspect-ratio:1;display:block}
.ci b{font-size:13px;font-weight:600}
.ci small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.win-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;border-radius:22px;background:radial-gradient(circle at 50% 30%,rgba(229,36,59,.35),transparent 65%),#221014;text-align:center}
.win-box .gwrap{width:110px;height:110px;display:block;animation:pop .45s}
.win-box h4{font-size:22px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:8px}
.two .bet{height:48px;font-size:16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-10px);z-index:80;max-width:min(92vw,420px);padding:12px 16px;border-radius:16px;background:#2e161d;color:#fff;font-weight:600;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#16653a}
.toast.err{background:#7a1f2a}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;color:#fff;font-weight:800;background:linear-gradient(150deg,var(--a),var(--b));text-transform:uppercase;overflow:hidden}
.empty-mini{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px;text-align:center;color:var(--muted)}
.empty-mini .ic{width:40px;height:40px}
.demo-note{margin:22px 0 0;text-align:center;color:#5e5e68;font-size:12px}


/* ---------- gift images & NFT cards ---------- */
.gi{position:relative;display:block;width:100%;height:100%;aspect-ratio:1}
.gi>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:imgIn .3s}
@keyframes imgIn{from{opacity:0}}
.gi:has(>img)>.gfb{visibility:hidden}
.gfb{position:absolute;left:6%;top:6%;width:88%;height:88%;border-radius:27%;background:radial-gradient(circle at 32% 26%,hsl(var(--h) 80% 70%),hsl(var(--h) 58% 42%) 62%,hsl(var(--h) 58% 30%));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.22);transition:opacity .25s}
.gfb text{font-family:"Unbounded","Onest",sans-serif;font-weight:900;font-size:21px;fill:#fff;letter-spacing:-1px}
span.gfb.art{left:0;top:0;width:100%;height:100%;background:none;box-shadow:none;border-radius:0;display:block}
span.gfb.art svg{width:100%;height:100%;display:block}
.nft{position:absolute;display:block;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 36%,hsl(var(--h) 72% 60%),hsl(var(--h) 62% 32%) 78%);box-shadow:0 12px 26px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.2)}
.nft::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.7px);background-size:12px 12px}
.nft::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 35%,rgba(255,255,255,.22) 45%,transparent 55%);z-index:3;pointer-events:none}
.nft-st{position:absolute;left:14%;right:14%;top:9%;z-index:1}
.nft-st .gfb{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.nft-full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;animation:imgIn .3s}
.nft:has(>.nft-full) .nft-st{visibility:hidden}
.nft-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));display:flex;flex-direction:column;align-items:center;line-height:1.15;color:#fff}
.nft-cap b{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nft-cap small{font-size:9.5px;opacity:.75;font-variant-numeric:tabular-nums}

/* ---------- hero slider ---------- */
.hero{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px 0;padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.hero::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;height:184px;border-radius:22px;overflow:hidden;display:block;isolation:isolate;text-align:left}
.slide .rays{position:absolute;right:-30%;top:-60%;width:120%;aspect-ratio:1;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);z-index:0;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sl-txt{position:absolute;left:16px;top:14px;bottom:14px;width:50%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:4}
.sl-t{font-family:var(--f-disp);font-weight:900;font-size:22px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.sl-t.gold{font-size:28px;background:linear-gradient(180deg,#fff6b5,#f6b51e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.sl-s{font-size:12.5px;color:rgba(255,255,255,.82);line-height:1.35}
.sl-btn{margin-top:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:12px;background:#fff;color:#1b1430;font-weight:800;font-size:14px;white-space:nowrap}
.sl-btn .coin{width:16px;height:16px}
.h-legend{background:radial-gradient(circle at 80% 50%,#8a46ff 0,#43168e 42%,#1a0b38 100%)}
.h-up{background:radial-gradient(circle at 80% 50%,#2fd06a 0,#127a3c 50%,#082f19 100%)}
.h-pvp{background:radial-gradient(circle at 80% 50%,#ffb21a 0,#b85a07 52%,#4a2204 100%)}
.fan{position:absolute;right:4px;top:0;bottom:0;width:48%;z-index:2}
.fan .nft{width:44%;top:50%;left:50%}
.fan .f1{transform:translate(-112%,-44%) rotate(-14deg)}
.fan .f3{transform:translate(12%,-44%) rotate(14deg)}
.fan .f2{width:56%;transform:translate(-50%,-52%);z-index:2}
.upg{position:absolute;right:10px;top:0;bottom:0;width:48%;display:flex;align-items:center;justify-content:center;gap:4px;z-index:2}
.upg .nft{position:relative;flex:none}
.upg .u1{width:36%;transform:rotate(-8deg);filter:saturate(.7) brightness(.85)}
.upg .u2{width:50%;transform:rotate(6deg)}
.upg .arrow{width:30px;height:30px;border-radius:50%;background:#fff;color:#18a852;display:grid;place-items:center;flex:none;z-index:3;box-shadow:0 0 18px rgba(80,255,150,.7)}
.upg .arrow .ic{width:17px;height:17px;stroke-width:2.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.dots i{width:6px;height:6px;border-radius:3px;background:#3f1f28;transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--acc)}
.bank-chip{position:relative;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:rgba(70,40,0,.35);color:#fff;font-weight:600;font-size:13px}
.bank-chip .coin{width:16px;height:16px}
.bn-pvp{gap:8px}
.pvp-card .pg{width:18px;height:18px;display:block}
.hc .dots4{display:grid;grid-template-columns:repeat(4,7px);gap:6px}
.hc .dots4 i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9}
.gcard.nftc{background:radial-gradient(circle at 50% 30%,hsl(var(--h) 52% 34%),#242427 72%)}
.gcard.nftc.sel{background:#33261f}
.gcard b{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnum{position:absolute;left:8px;top:6px;font-style:normal;font-size:11px;font-weight:700;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums}
.up-slot .gi{width:64%;height:auto;flex:none}
.amt.search{height:46px;flex:none}
.amt.search input{text-align:left;font-size:16px}
.amt.search .sic{width:18px;height:18px;color:#a8898f}
.pvp-card{gap:2px}

/* ---------- real NFT item cards ---------- */
.ncard{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 38%,hsl(var(--h) 60% 55%),hsl(var(--h) 55% 28%) 80%)}
.ncard>.gi{position:absolute;left:14%;top:14%;width:72%;height:72%}
.ncard>.nimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:imgIn .3s}
.ncard:has(>.nimg)>.gi{visibility:hidden}
.gcard .ncard{border-radius:12px}
.gnum{z-index:2;background:rgba(0,0,0,.38);padding:1px 6px;border-radius:7px;left:10px;top:10px;color:#fff}
.wb-art{position:relative;display:grid;place-items:center;width:180px;height:180px;margin:-6px 0}
.wb-art .rays2{position:absolute;inset:-24px;background:repeating-conic-gradient(rgba(255,215,90,.2) 0 8deg,transparent 8deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%);animation:spin 12s linear infinite}
.wb-art .ncard{width:150px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.55);animation:pop .45s}
.wb-art .gwrap{position:relative;width:124px;height:124px}

/* ---------- FX layer ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ---------- Stars top-up ---------- */
.star{width:1em;height:1em;flex:none;display:inline-block}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px}
.seg .star,.seg .coin{width:19px;height:19px}
.spacks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spack{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 11px;border-radius:18px;background:radial-gradient(circle at 50% 0%,rgba(255,200,60,.25),transparent 70%),#26121a;border:1px solid #3f1f28;text-align:center;transition:transform .12s}
.spack:active{transform:scale(.96)}
.spack .star{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(255,190,40,.55))}
.spack b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.spack small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.spack.hot::after{content:"ХИТ";position:absolute;top:-7px;right:-4px;background:linear-gradient(90deg,#ff7a1a,#ffb21a);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:7px;letter-spacing:.05em}
.spack.off{opacity:.5}

/* ---------- rocket ---------- */
.rk-stage{background:#000;height:290px}
body:has(.v-rocket),body:has(.v-rocket) .top.game{background:#000}
body:has(.v-rocket) .top.game .sq,body:has(.v-rocket) .top.game .balpill{background:#111114}
.rk-rocket{width:140px;height:72px;margin:-36px 0 0 -70px;transform-origin:center}
.rk-rocket img.rkx{object-fit:contain}
.rk-rocket .rkx{position:relative;z-index:1;width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.rk-rocket .fl{left:auto;right:86%;top:46%;width:46px;height:22px;margin:-11px 0 0;opacity:.85;border-radius:50% 22% 22% 50%/50%;background:linear-gradient(270deg,#fff 0,#fff3b0 12%,#ffb21f 40%,#ff5a1a 72%,rgba(255,70,20,0));filter:blur(.6px);transform-origin:right center;animation:flickX .09s infinite alternate}
.rk-rocket .fl.f2{width:26px;height:10px;margin-top:-5px;right:87%;background:linear-gradient(270deg,#fff,#b8f3ff 45%,rgba(120,220,255,0));animation-duration:.06s}
@keyframes flickX{to{transform:scaleX(.74) scaleY(.88)}}
.rk-cd-l{position:absolute;bottom:30px;font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:700;text-transform:uppercase}
.rk-mul[data-lv="1"] b{color:#ffe08a;text-shadow:0 0 24px rgba(255,200,60,.6)}
.rk-mul[data-lv="2"] b{color:#ffb14a;text-shadow:0 0 28px rgba(255,140,40,.75)}
.rk-mul[data-lv="3"] b{color:#ff8ae0;text-shadow:0 0 36px rgba(255,90,200,.85);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}

/* ---------- mines ---------- */
.mt{position:relative;overflow:hidden;background:linear-gradient(180deg,#3e3e4a,#2a2a33);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -4px 0 rgba(0,0,0,.32),0 3px 0 rgba(0,0,0,.25);color:#5a5a70;padding:24%}
.mt::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.09) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 3.4s infinite;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes sheen{55%,100%{transform:translateX(130%)}}
.mt .emb{width:100%;height:100%}
.mt.gemt::after,.mt.bomb::after{display:none}
.mt.gemt{background:radial-gradient(circle at 50% 38%,#4dffa6,#10a457 72%);box-shadow:0 0 18px rgba(40,230,130,.5),inset 0 -4px 0 rgba(0,0,0,.2);padding:12%}
.mt.bomb{background:radial-gradient(circle at 50% 38%,#ff5e6e,#6e0d1c 76%);box-shadow:0 0 22px rgba(255,60,80,.65);padding:10%}
.mt.dim{box-shadow:none;filter:saturate(.5)}
.shake{animation:shake .45s!important}
@keyframes shake{20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- dice ---------- */
.dt-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dt-head .dt-range{margin:0 0 0 auto}
.cube-wrap{width:54px;height:54px;perspective:420px;flex:none}
.cube{position:relative;display:block;width:54px;height:54px;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(32deg);transition:transform .8s cubic-bezier(.2,.8,.25,1)}
.fc{position:absolute;inset:0;border-radius:12px;background:linear-gradient(145deg,#ffffff,#d5d7e4);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:3px;box-shadow:inset 0 0 0 1.5px rgba(80,70,160,.18)}
.fc b{border-radius:50%}
.fc b.p{background:radial-gradient(circle at 35% 30%,#ff5a6e,#3a24b8)}
.f1 b.p{background:radial-gradient(circle at 35% 30%,#ff7a8a,#c2183a)}
.f1{transform:translateZ(27px)}.f6{transform:rotateY(180deg) translateZ(27px)}.f2{transform:rotateY(90deg) translateZ(27px)}.f5{transform:rotateY(-90deg) translateZ(27px)}.f3{transform:rotateX(90deg) translateZ(27px)}.f4{transform:rotateX(-90deg) translateZ(27px)}
.dt-big{font-family:"Onest",var(--f-ui);font-weight:900;font-size:40px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#e9e9f0;line-height:1}
.dt-big.rolling{color:#ff6b7d;filter:blur(.4px)}
.dt-big.win{color:#3ee07f;text-shadow:0 0 22px rgba(40,230,130,.55)}
.dt-big.lose{color:#ff5a6a;text-shadow:0 0 22px rgba(255,60,80,.45)}

/* ---------- pvp tiles with gifts ---------- */
.pv-tile .pt-g{display:block;width:34px;height:34px}
.pv-tile .pt-v{display:flex;align-items:center;gap:3px;font-size:12.5px}
.pv-tile .pt-v .coin{width:13px;height:13px}
.up-pointer{animation:glow 1.2s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 14px rgba(255,210,70,1))}}
.rtile{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 0 0 2px rgba(255,255,255,.14)}

.bn-rocket .art.uimg{width:132px;height:auto;top:20px;right:7%;transform:rotate(-14deg)}
.bn-rocket .art.uimg img{width:100%;display:block}
/* ---------- profile / block ---------- */
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.prof .av{width:76px;height:76px;font-size:28px;box-shadow:0 0 0 3px var(--acc)}
.pid{color:var(--acc-hi);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
#block{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#block .ic{width:54px;height:54px;color:var(--acc-hi)}
#block h2{font-size:24px;font-weight:800}
#block p{color:#c0c0c8;font-size:16px;line-height:1.5;max-width:340px}

/* ---------- admin ---------- */
.ad-title{font-size:19px;font-weight:800}
.ad-badge{margin-left:auto;padding:5px 10px;border-radius:10px;background:var(--acc-soft);color:var(--acc-hi);font-weight:700;font-size:13px}
.ad-tabs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.ad-tabs::-webkit-scrollbar{display:none}
.ad-tabs button{flex:none;height:38px;padding:0 14px;border-radius:12px;background:#211014;color:#c9c9d1;font-weight:600;font-size:14.5px}
.ad-tabs button.on{background:var(--acc);color:#fff}
.ad-card{margin-top:14px;background:#1d0d11;border:1px solid #2e161d;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ad-card h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.ad-card h3 .ic,.ad-card h3 .star{width:20px;height:20px;color:var(--acc-hi)}
.ad-card h3 small{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.ad-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.ad-l{display:flex;flex-direction:column;font-size:15px;min-width:0}
.ad-l small{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.ad-in{width:110px;height:40px;flex:none;border-radius:12px;background:#180b0e;border:1px solid #381b22;padding:0 12px;font-size:15px;font-weight:600;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.ad-in.wide2{width:min(52%,210px);text-align:left}
.ad-in.sm{width:86px}
.ad-in.ta{width:100%;height:auto;padding:10px 12px;text-align:left;resize:vertical;font-weight:500;line-height:1.4}
.ad-form .ad-in,.ad-card>.ad-in{width:100%;text-align:left}
.ad-in:focus{outline:none;border-color:var(--acc)}
select.ad-in{text-align:left;padding-right:6px}
.ad-color{width:52px;height:40px;border:0;border-radius:12px;background:none;padding:0;flex:none}
.ad-form{display:flex;flex-direction:column;gap:8px}
.ad-form.row{flex-direction:row}
.ad-form.row .ad-in{flex:1;min-width:0}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:#3f1f28;flex:none;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{background:#22c55e}
.sw.on i{transform:translateX(20px)}
.ad-note{color:var(--muted);font-size:13px;line-height:1.5}
.ad-warn{padding:10px 12px;border-radius:12px;background:#3a2a12;border:1px solid #6b4a12;color:#fbbf24;font-size:13.5px;line-height:1.45}
.ad-ok{padding:10px 12px;border-radius:12px;background:#12321f;border:1px solid #1d5c36;color:#5be38f;font-size:13.5px;line-height:1.45}
.ad-list{display:flex;flex-direction:column;gap:8px}
.ad-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#180b0e}
.ad-item>.gi{width:38px;height:38px;flex:none}
.ad-item>b{flex:1;min-width:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-item small.sub{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ad-x{width:32px;height:32px;border-radius:10px;background:#2b141b;display:grid;place-items:center;color:#ff7a88;flex:none}
.ad-x .ic{width:16px;height:16px}
.ad-chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:10px;background:#16402a;color:#5be38f;font-weight:700;font-size:13.5px;white-space:nowrap;flex:none}
.ad-chip.neg{background:#45161d;color:#ff7a88}
.st-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st-tile{background:#180b0e;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st-tile b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-tile small{color:var(--muted);font-size:12.5px}
.st-table{display:flex;flex-direction:column;gap:4px}
.st-row{display:grid;grid-template-columns:1.4fr .6fr 1fr 1fr;gap:8px;padding:9px 10px;border-radius:12px;background:#180b0e;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.st-row.h{background:none;color:var(--muted);font-size:12.5px;padding:2px 10px}
.st-row span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.st-row.top{grid-template-columns:1.4fr 1fr 1fr 1fr;margin-bottom:4px}
.st-row.feed{grid-template-columns:1.3fr 1.1fr .8fr .9fr;margin-bottom:4px}
.st-f{margin-bottom:8px}
.st-row small{display:block;color:var(--muted);font-size:11.5px}
.ad-sub{font-weight:700;font-size:14px;color:#c9c9d1;margin:10px 0 -2px}
.ad-case{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#1a1a1d}
.ad-case.off{opacity:.55}
.ad-case .thumb{width:50px;height:50px;border-radius:12px;flex:none;padding:6px;background:radial-gradient(circle,color-mix(in srgb,var(--g) 55%,transparent),#1f1f23 75%)}
.ad-case .thumb svg{width:100%;height:100%}
.ad-case .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.ad-case .meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-case .meta small{color:var(--muted);font-size:12.5px}
.ad-case .meta small.warn{color:#fbbf24}
.ad-mv{display:flex;flex-direction:column;gap:2px}
.ad-mv button{width:28px;height:20px;border-radius:7px;background:#2b141b;display:grid;place-items:center;color:#c9c9d1}
.ad-mv button .ic{width:14px;height:14px}
.ad-mv button.dn .ic{transform:rotate(180deg)}
.bet.sm{width:auto;height:38px;padding:0 14px;font-size:14px;border-radius:12px;flex:none}
.bet.danger{color:#ff7a88}
.ad-btns{display:flex;gap:8px;flex-wrap:wrap}
.ad-btns .bet{flex:1;min-width:130px;height:44px;font-size:15px}
.ad-back{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:var(--acc-hi);font-weight:700;font-size:15px}
.ad-back .ic{width:18px;height:18px}
.ad-pl{display:flex;flex-direction:column;gap:8px}
.ad-pl-h{display:flex;justify-content:space-between;align-items:baseline}
.ad-pl-h small{color:var(--muted);font-size:12.5px}
.ad-grid13{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ad-grid13 input{width:100%;min-width:0;height:34px;border-radius:9px;background:#180b0e;border:1px solid #381b22;color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.ad-steps{margin:0;padding-left:20px;color:#c0c0c8;font-size:14px;line-height:1.6}
.ad-steps a{color:var(--acc-hi)}
.ad-space{height:76px}
.ad-pub{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;padding:14px 16px 10px;background:linear-gradient(rgba(24,24,26,0),rgba(24,24,26,.96) 40%)}
.ad-pub-in{max-width:448px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ad-pub small{flex:1;color:var(--muted);font-size:12.5px;line-height:1.35}
.ad-pub small.dirty{color:#fbbf24}
.ad-pub .bet{width:auto;flex:none;height:46px;padding:0 18px;font-size:15.5px}

.ad-fab{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:28;display:flex;align-items:center;gap:6px;height:44px;padding:0 15px 0 12px;border-radius:22px;background:linear-gradient(135deg,#9a8cff,#d81f36);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 10px 24px -8px rgba(109,95,240,.9),inset 0 0 0 1.5px rgba(255,255,255,.18);animation:fabIn .35s cubic-bezier(.2,.9,.3,1.2)}
.ad-fab .ic{width:20px;height:20px;animation:spin 8s linear infinite}
.ad-fab:active{transform:scale(.94)}
@keyframes fabIn{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}

/* ================= SPANIX red theme ================= */
:root{--bg:#120709;--bar:#1a0b0e;--card:#221014;--card2:#2e161d;--field:#26121a;--line:#3a1d24;--muted:#b39aa0;--dim:#86686f;
  --acc:#e5243b;--acc-hi:#ff6b7d;--acc-soft:#3a1218;--acc-line:#6b1f2a;--vio:#ff3b4f;--red1:#ff3b4f;--red2:#b3112a}
body{background:radial-gradient(120% 60% at 50% -10%,#3a0a14 0%,transparent 60%),var(--bg);background-attachment:fixed}
.top{background:rgba(26,11,14,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabbar{background:rgba(23,10,13,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab.on{background:linear-gradient(180deg,rgba(255,59,79,.22),rgba(255,59,79,.08));color:#fff}
.tab.on .ic{color:var(--acc-hi);filter:drop-shadow(0 0 6px rgba(255,59,79,.7))}
.tab.on::before{background:linear-gradient(90deg,#ff3b4f,#ff8a3d);box-shadow:0 0 10px #ff3b4f}
.btn-top,.bet.ok{background:linear-gradient(90deg,#ff3b4f,#d61f3a)!important;box-shadow:0 8px 22px -10px rgba(255,59,79,.9)!important}
.bet.alt{background:linear-gradient(90deg,#ff3b4f,#c8102e);color:#fff}
.mascot{display:block;width:100%;height:100%}
/* header */
.brandtop{gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:48px;height:48px;border-radius:50%;padding:4px;flex:none;background:radial-gradient(circle at 50% 35%,#4a0d18,#1a0508);
  border:2px solid #ff3b4f;box-shadow:0 0 0 3px rgba(255,59,79,.18),0 0 18px rgba(255,59,79,.55)}
.brand-t{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand-t b{font-family:var(--f-disp);font-weight:900;font-size:21px;letter-spacing:-.01em;font-style:italic;
  background:linear-gradient(180deg,#fff 30%,#ffc2c9);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,59,79,.6))}
.brand-t b i{font-style:normal;color:#ff3b4f;-webkit-text-fill-color:#ff3b4f;font-size:15px;vertical-align:top;margin-left:2px}
.brand-t em{font-style:italic;font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:.18em;color:#ffd0d5;margin-top:3px}
.balcard{margin-left:auto;position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:7px 40px 7px 12px;border-radius:16px;
  background:linear-gradient(160deg,rgba(255,59,79,.16),rgba(255,59,79,.04));border:1px solid rgba(255,90,110,.35);box-shadow:inset 0 0 18px rgba(255,59,79,.12)}
.balcard small{font-size:11.5px;color:var(--muted)}
.balcard b{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.balcard .coin{width:19px;height:19px}
.balplus{position:absolute;right:7px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#ff3b4f,#c8102e);box-shadow:0 0 12px rgba(255,59,79,.7)}
.balplus .ic{width:15px;height:15px}
/* home cards */
.hx{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%;text-align:left;border-radius:24px;overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 80% at 85% 20%,rgba(255,59,79,.28),transparent 60%),linear-gradient(165deg,#2a0c13,#16070a 75%);
  border:1px solid rgba(255,90,110,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -24px rgba(255,30,60,.7);transition:transform .12s}
.hx:active{transform:scale(.985)}

// шансы: w = v^-a, подбираем a так, чтобы средний выигрыш = цена × отдача (дорогое выпадает реже)
function solveCase(c) {
  c.items = (c.items || []).filter(id => G[id]);
  const vals = c.items.map(id => G[id].v);
  if (!vals.length) { c.p = []; c.art = []; c.min = c.max = c.evReal = 0; return c; }
  c.min = Math.min(...vals); c.max = Math.max(...vals);
  c.art = c.items.slice().sort((x, y) => G[y].v - G[x].v).slice(0, 5);
  if (c.manual && c.w) {   // шансы, которые админ задал сам (в процентах)
    const ws = c.items.map(id => Math.max(0, +c.w[id] || 0)), tot = ws.reduce((x, y) => x + y, 0);
    if (tot > 0) { c.p = ws.map(w => w / tot); c.evReal = vals.reduce((t, v, k) => t + v * c.p[k], 0); return c; }
  }
  const target = c.price > 0 ? c.price * CONFIG.caseRtp : (+c.ev || .1);
  const evAt = a => { let t = 0, w = 0; vals.forEach(v => { const x = Math.pow(v, -a); t += x * v; w += x; }); return t / w; };
  let lo = -12, hi = 30;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (evAt(m) > target) lo = m; else hi = m; }
  const a = (lo + hi) / 2, ws = vals.map(v => Math.pow(v, -a)), tot = ws.reduce((x, y) => x + y, 0);
  c.p = ws.map(w => w / tot); c.evReal = evAt(a); c.min = Math.min(...vals); c.max = Math.max(...vals);
  c.art = c.items.slice().sort((x, y) => G[y].v - G[x].v).slice(0, 5);

}
