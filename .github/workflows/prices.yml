name: Цены с Fragment

on:
  schedule:
    - cron: '17 */3 * * *'   # каждые 3 часа
  workflow_dispatch:          # можно запустить вручную во вкладке Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать цены
        run: python scripts/fragment_prices.py
      - name: Сохранить prices.json
        run: |
          git config user.name "prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Цены не изменились"
          else
            git commit -m "Обновить цены с Fragment"
            git push
          fi
